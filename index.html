<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Şagird qiymətlərini hesablamaq üçün professional kalkulyator">
  <meta name="theme-color" content="#5b21b6">
  <title>Qiymətləndirmə Kalkulyatoru</title>
  
  <style>
    /* CSS Variables for Theme */
    :root {
      --primary-color: #5b21b6;
      --primary-hover: #4c1d95;
      --primary-light: #8b5cf6;
      --secondary-color: #06b6d4;
      --success-color: #10b981;
      --warning-color: #f59e0b;
      --danger-color: #ef4444;
      --background: #f9fafb;
      --surface: #ffffff;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --border-color: #e5e7eb;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --radius: 0.5rem;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      
      /* Result colors with better visibility */
      --grade-5-bg: #d1fae5;
      --grade-5-color: #065f46;
      --grade-4-bg: #dbeafe;
      --grade-4-color: #1e40af;
      --grade-3-bg: #fed7aa;
      --grade-3-color: #92400e;
      --grade-2-bg: #fee2e2;
      --grade-2-color: #991b1b;
    }

    /* Dark Mode */
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #111827;
        --surface: #1f2937;
        --text-primary: #f9fafb;
        --text-secondary: #d1d5db;
        --border-color: #374151;
        
        --grade-5-bg: #064e3b;
        --grade-5-color: #6ee7b7;
        --grade-4-bg: #1e3a8a;
        --grade-4-color: #93c5fd;
        --grade-3-bg: #78350f;
        --grade-3-color: #fcd34d;
        --grade-2-bg: #7f1d1d;
        --grade-2-color: #fca5a5;
      }
    }

    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--background);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    /* Container */
    .container {
      background: var(--surface);
      border-radius: 1rem;
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
      color: white;
      padding: 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      position: relative;
      z-index: 1;
    }

    .header p {
      font-size: 0.875rem;
      opacity: 0.9;
      position: relative;
      z-index: 1;
    }

    /* Tab Navigation */
    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border-color);
    }

    .tab {
      flex: 1;
      padding: 1rem;
      background: none;
      border: none;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }

    .tab:hover {
      color: var(--primary-color);
      background: rgba(139, 92, 246, 0.05);
    }

    .tab.active {
      color: var(--primary-color);
    }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary-color);
      animation: slideInTab 0.3s ease-out;
    }

    @keyframes slideInTab {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    /* Content */
    .content {
      padding: 2rem;
    }

    .section {
      display: none;
      animation: fadeIn 0.3s ease-out;
    }

    .section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* KSQ Count Selector */
    .ksq-selector {
      margin-bottom: 2rem;
      padding: 1rem;
      background: var(--background);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
    }

    .ksq-selector-label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 0.75rem;
      display: block;
    }

    .ksq-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .ksq-button {
      flex: 1;
      padding: 0.5rem;
      border: 2px solid var(--border-color);
      background: var(--surface);
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
    }

    .ksq-button:hover {
      border-color: var(--primary-color);
      color: var(--primary-color);
    }

    .ksq-button.active {
      background: var(--primary-color);
      border-color: var(--primary-color);
      color: white;
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 2px solid var(--border-color);
      border-radius: var(--radius);
      background: var(--background);
      color: var(--text-primary);
      transition: var(--transition);
      /* Force numeric keyboard on mobile */
      -webkit-appearance: none;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }

    .form-input::placeholder {
      color: var(--text-secondary);
    }

    /* Dynamic KSQ inputs container */
    .ksq-inputs {
      display: grid;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    /* Checkbox */
    .checkbox-group {
      display: flex;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .checkbox {
      width: 1.25rem;
      height: 1.25rem;
      margin-right: 0.75rem;
      cursor: pointer;
      accent-color: var(--primary-color);
    }

    /* Buttons */
    .button-group {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }

    .button {
      flex: 1;
      padding: 0.875rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .button-primary {
      background: var(--primary-color);
      color: white;
    }

    .button-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .button-secondary {
      background: var(--border-color);
      color: var(--text-primary);
    }

    .button-secondary:hover {
      background: #d1d5db;
    }

    /* Result Card */
    .result {
      margin-top: 2rem;
      padding: 1.5rem;
      border-radius: var(--radius);
      border: 2px solid;
      opacity: 0;
      transform: translateY(10px);
      transition: var(--transition);
    }

    .result.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Grade-specific result styling */
    .result.grade-5 {
      background: var(--grade-5-bg);
      border-color: var(--grade-5-color);
      color: var(--grade-5-color);
    }

    .result.grade-4 {
      background: var(--grade-4-bg);
      border-color: var(--grade-4-color);
      color: var(--grade-4-color);
    }

    .result.grade-3 {
      background: var(--grade-3-bg);
      border-color: var(--grade-3-color);
      color: var(--grade-3-color);
    }

    .result.grade-2 {
      background: var(--grade-2-bg);
      border-color: var(--grade-2-color);
      color: var(--grade-2-color);
    }

    .result-title {
      font-size: 0.875rem;
      opacity: 0.8;
      margin-bottom: 0.5rem;
    }

    .result-value {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      line-height: 1;
    }

    .result-grade {
      display: inline-block;
      padding: 0.5rem 1.5rem;
      font-size: 1.5rem;
      font-weight: 700;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(10px);
    }

    .result-details {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(0, 0, 0, 0.1);
      font-size: 0.875rem;
      opacity: 0.8;
    }

    /* Help Text */
    .help-text {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    /* Loading State */
    .loading {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid transparent;
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive Design */
    @media (max-width: 640px) {
      .header h1 {
        font-size: 1.5rem;
      }
      
      .content {
        padding: 1.5rem;
      }

      .ksq-buttons {
        flex-wrap: wrap;
      }

      .ksq-button {
        min-width: calc(33.333% - 0.33rem);
      }
    }

    /* Accessibility */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Focus Visible */
    *:focus-visible {
      outline: 2px solid var(--primary-color);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Qiymətləndirmə Kalkulyatoru</h1>
      <p>Şagird qiymətlərini asanlıqla hesablayın</p>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab active" role="tab" aria-selected="true" aria-controls="yarimillik-panel" onclick="switchTab('yarimillik')">
        Yarımillik
      </button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="illik-panel" onclick="switchTab('illik')">
        İllik
      </button>
    </nav>

    <main class="content">
      <!-- Yarımillik Section -->
      <section id="yarimillik" class="section active" role="tabpanel" aria-labelledby="yarimillik-tab">
        <div class="ksq-selector">
          <label class="ksq-selector-label">KSQ sayını seçin:</label>
          <div class="ksq-buttons">
            <button class="ksq-button" onclick="setKSQCount(1)">1 KSQ</button>
            <button class="ksq-button" onclick="setKSQCount(2)">2 KSQ</button>
            <button class="ksq-button active" onclick="setKSQCount(3)">3 KSQ</button>
            <button class="ksq-button" onclick="setKSQCount(4)">4 KSQ</button>
            <button class="ksq-button" onclick="setKSQCount(5)">5 KSQ</button>
            <button class="ksq-button" onclick="setKSQCount(6)">6 KSQ</button>
          </div>
        </div>

        <form onsubmit="calculateYarimillik(event)">
          <div id="ksq-inputs" class="ksq-inputs">
            <!-- KSQ inputs will be dynamically generated here -->
          </div>

          <div class="checkbox-group">
            <input 
              type="checkbox" 
              id="has_bsq" 
              class="checkbox"
              onchange="toggleBSQ()"
            >
            <label for="has_bsq" class="form-label" style="margin-bottom: 0;">
              BSQ daxil edilib
            </label>
          </div>

          <div class="form-group" id="bsq-group" style="display: none;">
            <label for="bsq" class="form-label">BSQ balı</label>
            <input 
              type="tel"
              inputmode="decimal"
              pattern="[0-9]*[.,]?[0-9]*"
              id="bsq" 
              class="form-input" 
              placeholder="0-100 arası bal daxil edin"
              min="0"
              max="100"
              step="0.1"
              aria-describedby="bsq-help"
            >
            <p id="bsq-help" class="help-text">Böyük summativ qiymətləndirmə balı</p>
          </div>

          <div class="button-group">
            <button type="submit" class="button button-primary">
              <span>Hesabla</span>
            </button>
            <button type="button" class="button button-secondary" onclick="resetForm('yarimillik')">
              <span>Təmizlə</span>
            </button>
          </div>
        </form>

        <div id="yarimillik-result" class="result">
          <p class="result-title">Yarımillik nəticəsi</p>
          <p class="result-value" id="yarimillik-bal">0</p>
          <span class="result-grade" id="yarimillik-qiymet">0</span>
          <div class="result-details" id="yarimillik-details"></div>
        </div>
      </section>

      <!-- İllik Section -->
      <section id="illik" class="section" role="tabpanel" aria-labelledby="illik-tab">
        <form onsubmit="calculateIllik(event)">
          <div class="form-group">
            <label for="y1" class="form-label">1-ci yarımillik balı</label>
            <input 
              type="tel"
              inputmode="decimal"
              pattern="[0-9]*[.,]?[0-9]*"
              id="y1" 
              class="form-input" 
              placeholder="0-100 arası bal daxil edin"
              min="0"
              max="100"
              step="0.1"
              required
            >
          </div>

          <div class="form-group">
            <label for="y2" class="form-label">2-ci yarımillik balı</label>
            <input 
              type="tel"
              inputmode="decimal"
              pattern="[0-9]*[.,]?[0-9]*"
              id="y2" 
              class="form-input" 
              placeholder="0-100 arası bal daxil edin"
              min="0"
              max="100"
              step="0.1"
              required
            >
          </div>

          <div class="button-group">
            <button type="submit" class="button button-primary">
              <span>Hesabla</span>
            </button>
            <button type="button" class="button button-secondary" onclick="resetForm('illik')">
              <span>Təmizlə</span>
            </button>
          </div>
        </form>

        <div id="illik-result" class="result">
          <p class="result-title">İllik nəticəsi</p>
          <p class="result-value" id="illik-bal">0</p>
          <span class="result-grade" id="illik-qiymet">0</span>
          <div class="result-details" id="illik-details"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    // Global state
    let ksqCount = 3;

    // Initialize on load
    document.addEventListener('DOMContentLoaded', () => {
      generateKSQInputs(3);
      loadFormData();
    });

    // Set KSQ count
    function setKSQCount(count) {
      ksqCount = count;
      
      // Update button states
      document.querySelectorAll('.ksq-button').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
      
      // Generate new inputs
      generateKSQInputs(count);
      
      // Save to localStorage
      localStorage.setItem('ksqCount', count);
    }

    // Generate KSQ input fields dynamically
    function generateKSQInputs(count) {
      const container = document.getElementById('ksq-inputs');
      container.innerHTML = '';
      
      for (let i = 1; i <= count; i++) {
        const formGroup = document.createElement('div');
        formGroup.className = 'form-group';
        formGroup.innerHTML = `
          <label for="ksq${i}" class="form-label">KSQ ${i}</label>
          <input 
            type="tel"
            inputmode="decimal"
            pattern="[0-9]*[.,]?[0-9]*"
            id="ksq${i}" 
            class="form-input ksq-input" 
            placeholder="0-100 arası bal daxil edin"
            min="0"
            max="100"
            step="0.1"
            required
            aria-describedby="ksq${i}-help"
          >
          <p id="ksq${i}-help" class="help-text">${i}-ci kiçik summativ qiymətləndirmə balı</p>
        `;
        container.appendChild(formGroup);
      }
      
      // Add event listeners for validation and auto-save
      container.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', validateNumericInput);
        input.addEventListener('change', saveFormData);
      });
      
      // Load saved values if any
      loadKSQValues();
    }

    // Validate numeric input
    function validateNumericInput(event) {
      let value = event.target.value;
      
      // Replace comma with dot
      value = value.replace(',', '.');
      
      // Remove any non-numeric characters except dot
      value = value.replace(/[^0-9.]/g, '');
      
      // Ensure only one dot
      const parts = value.split('.');
      if (parts.length > 2) {
        value = parts[0] + '.' + parts.slice(1).join('');
      }
      
      // Update input value
      event.target.value = value;
      
      // Validate range
      const numValue = parseFloat(value);
      if (!isNaN(numValue)) {
        if (numValue < 0) event.target.value = '0';
        if (numValue > 100) event.target.value = '100';
      }
    }

    // Tab switching functionality
    function switchTab(tabName) {
      // Update tab buttons
      const tabs = document.querySelectorAll('.tab');
      tabs.forEach(tab => {
        tab.classList.remove('active');
        tab.setAttribute('aria-selected', 'false');
      });
      
      // Update sections
      const sections = document.querySelectorAll('.section');
      sections.forEach(section => {
        section.classList.remove('active');
      });
      
      // Activate selected tab and section
      const activeTab = Array.from(tabs).find(tab => 
        tab.textContent.trim().toLowerCase() === tabName.toLowerCase()
      );
      if (activeTab) {
        activeTab.classList.add('active');
        activeTab.setAttribute('aria-selected', 'true');
      }
      
      document.getElementById(tabName).classList.add('active');
      
      // Hide results when switching tabs
      document.querySelectorAll('.result').forEach(result => {
        result.classList.remove('visible');
      });
    }

    // Toggle BSQ input visibility
    function toggleBSQ() {
      const checkbox = document.getElementById('has_bsq');
      const bsqGroup = document.getElementById('bsq-group');
      const bsqInput = document.getElementById('bsq');
      
      if (checkbox.checked) {
        bsqGroup.style.display = 'block';
        bsqInput.required = true;
      } else {
        bsqGroup.style.display = 'none';
        bsqInput.required = false;
        bsqInput.value = '';
      }
    }

    // Convert string to float safely
    function toFloatSafe(val) {
      const num = parseFloat(String(val).replace(',', '.'));
      return isNaN(num) ? 0 : num;
    }

    // Calculate grade based on score
    function qiymetVer(bal) {
      if (bal >= 81) return 5;
      if (bal >= 61) return 4;
      if (bal >= 31) return 3;
      return 2;
    }

    // Get grade description
    function getGradeDescription(grade) {
      switch(grade) {
        case 5: return 'Əla';
        case 4: return 'Yaxşı';
        case 3: return 'Kafi';
        case 2: return 'Qeyri-kafi';
        default: return '';
      }
    }

    // Show result with animation
    function showResult(resultId, bal, qiymet, details = '') {
      const resultDiv = document.getElementById(resultId);
      const balElement = document.getElementById(resultId.replace('-result', '-bal'));
      const qiymetElement = document.getElementById(resultId.replace('-result', '-qiymet'));
      const detailsElement = document.getElementById(resultId.replace('-result', '-details'));
      
      // Update content
      balElement.textContent = bal.toFixed(1);
      qiymetElement.textContent = `${qiymet} - ${getGradeDescription(qiymet)}`;
      
      // Update result card styling based on grade
      resultDiv.className = `result grade-${qiymet}`;
      
      // Add details if provided
      if (details && detailsElement) {
        detailsElement.innerHTML = details;
      }
      
      // Animate result
      setTimeout(() => {
        resultDiv.classList.add('visible');
      }, 100);
    }

    // Calculate Yarımillik
    function calculateYarimillik(event) {
      event.preventDefault();
      
      // Get all KSQ values
      const ksqValues = [];
      for (let i = 1; i <= ksqCount; i++) {
        const value = toFloatSafe(document.getElementById(`ksq${i}`).value);
        if (value < 0 || value > 100) {
          alert('KSQ balları 0-100 arasında olmalıdır!');
          return;
        }
        ksqValues.push(value);
      }
      
      const hasBsq = document.getElementById('has_bsq').checked;
      const b = hasBsq ? toFloatSafe(document.getElementById('bsq').value) : 0;
      
      if (hasBsq && (b < 0 || b > 100)) {
        alert('BSQ balı 0-100 arasında olmalıdır!');
        return;
      }
      
      // Calculate result
      const ortalama = ksqValues.reduce((sum, val) => sum + val, 0) / ksqValues.length;
      const netice = hasBsq ? (ortalama * 0.4 + b * 0.6) : ortalama;
      const bal = Math.round(netice * 10) / 10;
      const qiymet = qiymetVer(bal);
      
      // Create details
      let details = `<strong>KSQ ortalaması:</strong> ${ortalama.toFixed(1)}<br>`;
      if (hasBsq) {
        details += `<strong>BSQ balı:</strong> ${b.toFixed(1)}<br>`;
        details += `<strong>Hesablama:</strong> (${ortalama.toFixed(1)} × 40%) + (${b.toFixed(1)} × 60%)`;
      }
      
      showResult('yarimillik-result', bal, qiymet, details);
      saveFormData();
    }

    // Calculate İllik
    function calculateIllik(event) {
      event.preventDefault();
      
      const y1 = toFloatSafe(document.getElementById('y1').value);
      const y2 = toFloatSafe(document.getElementById('y2').value);
      
      // Validate inputs
      if (y1 < 0 || y1 > 100 || y2 < 0 || y2 > 100) {
        alert('Yarımillik balları 0-100 arasında olmalıdır!');
        return;
      }
      
      // Calculate result
      const netice = (y1 + y2) / 2;
      const bal = Math.round(netice * 10) / 10;
      const qiymet = qiymetVer(bal);
      
      // Create details
      const details = `<strong>Hesablama:</strong> (${y1.toFixed(1)} + ${y2.toFixed(1)}) ÷ 2`;
      
      showResult('illik-result', bal, qiymet, details);
      saveFormData();
    }

    // Reset form
    function resetForm(formType) {
      // Clear inputs
      const inputs = document.querySelectorAll(`#${formType} input`);
      inputs.forEach(input => {
        if (input.type === 'checkbox') {
          input.checked = false;
        } else {
          input.value = '';
        }
      });
      
      // Hide BSQ if yarımillik
      if (formType === 'yarimillik') {
        document.getElementById('bsq-group').style.display = 'none';
        document.getElementById('bsq').required = false;
      }
      
      // Hide result
      document.getElementById(`${formType}-result`).classList.remove('visible');
      
      // Clear localStorage
      localStorage.removeItem('gradeCalculatorData');
    }

    // Save form data to localStorage
    function saveFormData() {
      const formData = {
        ksqCount: ksqCount,
        yarimillik: {
          ksqValues: {},
          has_bsq: document.getElementById('has_bsq').checked,
          bsq: document.getElementById('bsq').value
        },
        illik: {
          y1: document.getElementById('y1').value,
          y2: document.getElementById('y2').value
        }
      };
      
      // Save KSQ values
      for (let i = 1; i <= ksqCount; i++) {
        const input = document.getElementById(`ksq${i}`);
        if (input) {
          formData.yarimillik.ksqValues[`ksq${i}`] = input.value;
        }
      }
      
      localStorage.setItem('gradeCalculatorData', JSON.stringify(formData));
    }

    // Load form data from localStorage
    function loadFormData() {
      const savedData = localStorage.getItem('gradeCalculatorData');
      if (savedData) {
        const formData = JSON.parse(savedData);
        
        // Load KSQ count
        if (formData.ksqCount) {
          ksqCount = formData.ksqCount;
          // Update button state
          document.querySelectorAll('.ksq-button').forEach(btn => {
            btn.classList.remove('active');
            if (btn.textContent.includes(ksqCount)) {
              btn.classList.add('active');
            }
          });
          generateKSQInputs(ksqCount);
        }
        
        // Load yarımillik data
        if (formData.yarimillik) {
          document.getElementById('has_bsq').checked = formData.yarimillik.has_bsq || false;
          document.getElementById('bsq').value = formData.yarimillik.bsq || '';
          if (formData.yarimillik.has_bsq) {
            toggleBSQ();
          }
        }
        
        // Load illik data
        if (formData.illik) {
          document.getElementById('y1').value = formData.illik.y1 || '';
          document.getElementById('y2').value = formData.illik.y2 || '';
        }
      }
    }

    // Load KSQ values from saved data
    function loadKSQValues() {
      const savedData = localStorage.getItem('gradeCalculatorData');
      if (savedData) {
        const formData = JSON.parse(savedData);
        if (formData.yarimillik && formData.yarimillik.ksqValues) {
          Object.keys(formData.yarimillik.ksqValues).forEach(key => {
            const input = document.getElementById(key);
            if (input) {
              input.value = formData.yarimillik.ksqValues[key];
            }
          });
        }
      }
    }

    // Add keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        // Tab navigation is handled by browser
        return;
      }
      
      // Switch tabs with arrow keys
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        const tabs = document.querySelectorAll('.tab');
        const activeIndex = Array.from(tabs).findIndex(tab => tab.classList.contains('active'));
        
        if (e.key === 'ArrowLeft' && activeIndex > 0) {
          tabs[activeIndex - 1].click();
        } else if (e.key === 'ArrowRight' && activeIndex < tabs.length - 1) {
          tabs[activeIndex + 1].click();
        }
      }
    });

    // Add input validation for all numeric inputs
    document.addEventListener('input', (e) => {
      if (e.target.matches('input[type="tel"]')) {
        validateNumericInput(e);
      }
    });

    // Auto-save on input change
    document.addEventListener('change', (e) => {
      if (e.target.matches('input')) {
        saveFormData();
      }
    });

    // Add touch feedback for mobile
    document.addEventListener('touchstart', (e) => {
      if (e.target.matches('.button, .ksq-button, .tab')) {
        e.target.style.transform = 'scale(0.95)';
      }
    });

    document.addEventListener('touchend', (e) => {
      if (e.target.matches('.button, .ksq-button, .tab')) {
        e.target.style.transform = '';
      }
    });

    // Progressive Web App support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // Register service worker for offline support
        // navigator.serviceWorker.register('/sw.js');
      });
    }

    // Add visual feedback for calculation
    function animateCalculation(button) {
      const originalText = button.innerHTML;
      button.innerHTML = '<span class="loading"></span> Hesablanır...';
      button.disabled = true;
      
      setTimeout(() => {
        button.innerHTML = originalText;
        button.disabled = false;
      }, 500);
    }

    // Override form submissions to add animation
    document.querySelectorAll('form').forEach(form => {
      form.addEventListener('submit', (e) => {
        const submitButton = form.querySelector('.button-primary');
        animateCalculation(submitButton);
      });
    });

    // Add number format helper
    function formatNumber(num) {
      return num.toFixed(1).replace('.', ',');
    }

    // Add copy result functionality
    function copyResult(resultId) {
      const bal = document.getElementById(resultId.replace('-result', '-bal')).textContent;
      const qiymet = document.getElementById(resultId.replace('-result', '-qiymet')).textContent;
      const text = `Bal: ${bal}, Qiymət: ${qiymet}`;
      
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          showToast('Nəticə kopyalandı!');
        });
      }
    }

    // Simple toast notification
    function showToast(message) {
      const toast = document.createElement('div');
      toast.style.cssText = `
        position: fixed;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        background: var(--primary-color);
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: var(--radius);
        box-shadow: var(--shadow-lg);
        z-index: 1000;
        animation: slideUp 0.3s ease-out;
      `;
      toast.textContent = message;
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.style.animation = 'slideDown 0.3s ease-out';
        setTimeout(() => toast.remove(), 300);
      }, 2000);
    }

    // Add slide animations
    const style = document.createElement('style');
    style.textContent = `
      @keyframes slideUp {
        from { transform: translate(-50%, 100%); opacity: 0; }
        to { transform: translate(-50%, 0); opacity: 1; }
      }
      @keyframes slideDown {
        from { transform: translate(-50%, 0); opacity: 1; }
        to { transform: translate(-50%, 100%); opacity: 0; }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
